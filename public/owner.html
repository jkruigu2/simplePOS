<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Owner console</title>
<style>
:root{--bg:#f1f4f6;--card:#fff;--tx:#0f1b2d;--mut:#5d6b7c;--bd:#dde3e9;--pri:#0e7c66;--bad:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--bad:#f0776a;--warn:#e0b04a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
input,button{font:inherit;color:inherit;height:38px;border:1px solid var(--bd);border-radius:8px;padding:0 12px;background:var(--card)}
input{width:100%;margin-bottom:8px}button{cursor:pointer;font-weight:500}button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.d{color:var(--bad)}
button.s{height:30px;padding:0 9px;font-size:13px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-size:13px}
.b{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}.active{background:#d7f0e8;color:#0a6552}.grace{background:#fdecc8;color:#8a5a00}.expired,.suspended{background:#f7d6d2;color:#a02b1f}
.m{color:var(--mut)}.err{color:var(--bad)}.tw{overflow-x:auto}
</style>
</head>
<body><div class="w">
<h1>Owner console</h1>
<div class="c"><label class="m">Owner key (the <code>OWNER_KEY</code> set on your server)</label>
<div class="r"><input id="k" type="password" placeholder="Owner key" style="flex:1;margin:0" autocomplete="off"><button class="p" onclick="load()">Open</button></div><div id="e" class="err"></div></div>
<div id="out"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY=sessionStorage.getItem('ok')||'';if(KEY)$('#k').value=KEY;
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','x-owner-key':KEY},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed ('+r.status+')');return j}
async function load(){KEY=$('#k').value.trim();$('#e').textContent='';try{const r=await api('GET','/api/owner/companies');sessionStorage.setItem('ok',KEY);draw(r)}catch(e){$('#e').textContent=e.message}}
function draw(r){const D=864e5,fd=t=>t?new Date(t).toLocaleDateString():'—';
  $('#out').innerHTML=`<div class="c"><b>${r.companies.length}</b> companies · new companies get a <b>${r.trial}-day</b> free trial · <b>${r.grace}</b> grace days after the end date before access is blocked. Companies with no end date are never blocked.</div>
  <div class="c tw"><table><tr><th>Company</th><th>Status</th><th>Valid until</th><th>Users</th><th>Actions</th></tr>${r.companies.sort((a,b)=>(a.info.until||9e15)-(b.info.until||9e15)).map(c=>{const i=c.info;return `<tr><td><b>${esc(c.name)}</b><br><span class="m">${esc(c.code)} · ${esc(c.phone||'')}</span></td>
  <td><span class="b ${i.state}">${i.state}</span><br><span class="m">${esc(i.plan)}${i.days!=null?' · '+(i.days>0?i.days+' days left':(-i.days)+' days ago'):''}</span></td><td>${fd(i.until)}</td><td>${c.users}</td>
  <td><div class="r"><button class="s" onclick="add('${esc(c.code)}',30)">+30 days</button><button class="s" onclick="add('${esc(c.code)}',90)">+90</button><button class="s" onclick="add('${esc(c.code)}',365)">+1 year</button><button class="s" onclick="setd('${esc(c.code)}')">Set date</button><button class="s ${i.state==='suspended'?'':'d'}" onclick="sus('${esc(c.code)}',${i.state==='suspended'})">${i.state==='suspended'?'Resume':'Suspend'}</button><button class="s" onclick="rec('${esc(c.code)}')">New recovery code</button></div></td></tr>`}).join('')}</table></div>`}
async function post(p,b){try{const r=await api('POST',p,b);await load();return r}catch(e){alert(e.message)}}
const add=(code,n)=>confirm('Add '+n+' days to '+code+'?')&&post('/api/owner/subscription',{code,addDays:n,status:'active',plan:'standard'});
function setd(code){const d=prompt('Valid until (YYYY-MM-DD) for '+code+':');if(d)post('/api/owner/subscription',{code,until:d.trim(),status:'active',plan:'standard'})}
const sus=(code,isSus)=>confirm((isSus?'Resume ':'Suspend ')+code+'?')&&post('/api/owner/subscription',{code,status:isSus?'active':'suspended'});
async function rec(code){if(!confirm('Make a new recovery code for '+code+'? The old one stops working.'))return;const r=await post('/api/owner/recovery',{code});if(r&&r.code)prompt('New recovery code for '+code+' (copy it and give it to the shop admin):',r.code)}
if(KEY)load();
</script>
</body></html>
