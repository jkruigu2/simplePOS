<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple POS</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0e7c66"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1f4f6;--card:#fff;--tx:#0f1b2d;--mut:#5d6b7c;--bd:#dde3e9;--pri:#0e7c66;--pri2:#0a6552;--pritx:#fff;--soft:#e6f4f0;--ok:#0e7c66;--bad:#c0392b;--warn:#b7791f;--tl:92%;--tt:28%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--pri2:#26a588;--pritx:#06201a;--soft:#12332c;--ok:#2fbf9b;--bad:#f0776a;--warn:#e0b04a;--tl:22%;--tt:82%}}
:root[data-theme="dark"]{--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--pri2:#26a588;--pritx:#06201a;--soft:#12332c;--ok:#2fbf9b;--bad:#f0776a;--warn:#e0b04a;--tl:22%;--tt:82%}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 104px}
h1{font-size:18px;margin:0;font-weight:600}h2{font-size:16px;margin:0 0 12px;font-weight:600}
nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--bd);margin:0 -14px 14px;padding:0 10px 0 14px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav button{height:50px;padding:0 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mut);font-weight:500;white-space:nowrap}
nav button:hover:not(:disabled){background:none;border-color:transparent;border-bottom-color:var(--bd);color:var(--tx)}
nav button.act{color:var(--pri);border-bottom-color:var(--pri);background:none}
nav .gear{height:40px;width:40px;padding:0;border:1px solid var(--bd);border-radius:8px;font-size:18px;color:var(--tx);background:var(--card);flex-shrink:0}
nav .gear:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
.cart{border-top:3px solid var(--pri)}#tot{font-size:28px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid.two{grid-template-columns:1.3fr 1fr}.grid.half{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{margin-bottom:0}
button{font:inherit;height:38px;padding:0 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
button.pri:hover:not(:disabled){background:var(--pri2);border-color:var(--pri2)}
button.act{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
button.del{color:var(--bad)}button.del:hover:not(:disabled){background:rgba(192,57,43,.08);border-color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
td button{height:30px;padding:0 10px;font-size:13px}.qty button{height:30px;padding:0 10px}
input,select{font:inherit;color:inherit;width:100%;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-bottom:8px}
input[type=checkbox]{width:auto;height:auto}
td input,td select{height:34px;margin:0;padding:0 8px;width:88px}
label{font-size:13px;color:var(--mut);font-weight:500}
.tblw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px;background:var(--bg)}
tbody tr:last-child td,tr:last-child>td{border-bottom:0}
tr:hover>td{background:var(--soft)}
tfoot td{font-weight:600;border-top:2px solid var(--bd);border-bottom:0;background:var(--bg)}
.r{text-align:right}.mut{color:var(--mut)}.low{color:var(--warn);font-weight:600}.out,.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.tblw>p{padding:14px;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);padding:12px 14px}.stat span{font-size:13px}.stat b{display:block;font-size:22px;font-weight:600}
.tag{display:inline-block;background:hsl(var(--h) 55% var(--tl));color:hsl(var(--h) 60% var(--tt));border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:600}
.cr td:first-child{border-left:4px solid hsl(var(--h) 60% 48%);padding-left:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{height:34px;padding:0 13px;border-radius:8px;white-space:nowrap;font-size:13.5px;border:1px solid hsl(var(--h,200) 40% 60%/.5);background:hsl(var(--h,200) 50% var(--tl));color:hsl(var(--h,200) 60% var(--tt))}
.chip.on{background:hsl(var(--h,200) 55% 36%);color:#fff;border-color:transparent}
.badge{background:var(--soft);color:var(--pri);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
.logo{width:52px;height:52px;border-radius:12px;background:var(--pri);display:grid;place-items:center;font-size:26px;margin:0 auto 10px}
.auth{max-width:420px;margin:8vh auto 0;padding:24px}.ctr{text-align:center}.err{color:var(--bad);min-height:20px;font-size:14px}
.prow{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.prow select{width:135px;margin:0}.prow input{flex:1;min-width:90px;margin:0}
.qty{display:flex;gap:6px;align-items:center}.qty input{width:58px;text-align:center;padding:0 4px;height:30px}
.dh{font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}
.modal,.cfm{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}
.modal>.card,.cfm>.card{box-shadow:0 20px 50px rgba(0,0,0,.3);border-radius:12px;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.receipt{width:100%;max-width:340px;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fff;color:#111;border-color:#e5e7eb}
.receipt hr{border:0;border-top:1px dashed #999}.receipt .mut{color:#666}.receipt tr:hover>td{background:none}
.drbg{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:310px;max-width:86vw;height:100%;background:var(--card);border-left:1px solid var(--bd);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(100%)}}
.dcard{background:var(--soft);border-radius:10px;padding:12px}
.ditem{display:flex;gap:10px;align-items:center;width:100%;height:44px;text-align:left;margin-bottom:6px}.ditem span{font-size:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none}
.toast{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .18s;max-width:90vw}
.toast span{margin-right:8px;font-weight:700;color:var(--ok)}.t-warn span{color:var(--warn)}.t-err span{color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ld{position:fixed;inset:0;background:rgba(10,20,30,.5);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:200;color:#fff;font-weight:600}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg text{fill:var(--mut);font-size:9px}svg .b1{fill:var(--pri)}svg .b2{fill:var(--warn)}
.pw{position:relative;margin-bottom:8px}.pw input{margin:0;padding-right:46px}.pw button{position:absolute;right:4px;top:4px;height:34px;width:36px;padding:0;display:grid;place-items:center;border:0;background:none;color:var(--mut)}.pw button:hover:not(:disabled){background:var(--soft);color:var(--tx)}
.tb{display:flex;justify-content:flex-end;margin-bottom:6px}.cols{position:relative}.cols summary{cursor:pointer;font-size:13px;color:var(--mut);list-style:none;padding:5px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}.cols summary::-webkit-details-marker{display:none}
.colbox{position:absolute;right:0;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:180px}.colbox label{display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--tx);font-size:14px}.colbox input{width:auto;height:auto;margin:0}
.pgr{margin-top:8px}th.srt{cursor:pointer;user-select:none}th.srt::after{content:'↕';opacity:.35;margin-left:5px}th[data-s="1"]::after{content:'↑';opacity:1}th[data-s="-1"]::after{content:'↓';opacity:1}
tr.exm td{opacity:.5}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;padding:4px 0}.chk input{width:auto;height:auto;margin:0}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:300}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body *{visibility:hidden}.modal,.receipt,.receipt *{visibility:visible}.modal{position:absolute;background:none;padding:0;display:block}.receipt{border:0;max-width:100%;box-shadow:none}.noprint{display:none!important}.ld{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const K={c:'pos2_co',u:'pos2_users',s:'pos2_session',g:'pos2_cats',p:'pos2_prods',l:'pos2_sales',e:'pos2_exp'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let token='';try{token=localStorage.getItem('pos3_token')||''}catch(e){}
const APPEND=['/api/sales','/api/moves','/api/logs','/api/rets'];
const pend=()=>load('pos3_q',[]).length;
const pill=()=>navigator.onLine&&!pend()?'':`<span class="badge" style="background:var(--warn);color:#fff">${navigator.onLine?'Syncing '+pend():'Offline'+(pend()?' · '+pend()+' waiting':'')}</span>`;
function cacheState(){try{localStorage.setItem('pos3_cache',JSON.stringify({cos,users,cats,prods,sales,expenses,moves,logs,rets,branches,session}))}catch(e){}}
async function raw(m,p,b){let r;try{r=await fetch((window.POS_API||'')+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined})}catch(x){const e=new Error('You are offline - connect to the internet and try again');e.net=true;throw e}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||(r.status===404||r.status===405?'Server is missing this feature - deploy the latest server.js':'Request failed ('+r.status+')'));return j}
function enqueue(m,p,b){let q=load('pos3_q',[]);
  if(APPEND.includes(p)){const e=q.find(x=>x.p===p);if(e){const ids=new Set(e.b.map(x=>x.id));b.forEach(x=>{if(!ids.has(x.id))e.b.push(x)})}else q.push({m,p,b:[...b]})}
  else{q=q.filter(x=>x.p!==p);q.push({m,p,b})}
  try{localStorage.setItem('pos3_q',JSON.stringify(q))}catch(e){}}
async function flushQ(){let q=load('pos3_q',[]);
  while(q.length){const e=q[0];try{await raw(e.m,e.p,e.b)}catch(x){if(x.net)return false;toast(x.message,'err')}q.shift();try{localStorage.setItem('pos3_q',JSON.stringify(q))}catch(x){}}return true}
let nb=0;
function busy(on,m){nb=Math.max(0,nb+(on?1:-1));let e=document.getElementById('ld');
  if(nb>0&&!e){e=document.createElement('div');e.id='ld';e.className='ld';e.innerHTML='<div class="spin"></div><div id="ldt"></div>';document.body.appendChild(e)}
  if(e&&on)document.getElementById('ldt').textContent=m==='GET'?'Loading…':'Saving…';
  if(nb===0&&e)e.remove()}
async function api(m,p,b,quiet,queue){if(!quiet)busy(true,m);
  try{if(queue&&!navigator.onLine){enqueue(m,p,b);return{queued:1}}
    try{return await raw(m,p,b)}catch(e){if(e.net&&queue){enqueue(m,p,b);return{queued:1}}throw e}}
  finally{if(!quiet)busy(false)}}
const ROUTE={[K.g]:'cats',[K.p]:'prods',[K.l]:'sales',[K.e]:'expenses'};
const save=(k,v)=>{if(ROUTE[k]){api('PUT','/api/'+ROUTE[k],k===K.l?v.slice(-1):v,false,true).catch(e=>toast(e.message,'err'));cacheState()}else try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function boot(q){
  await flushQ();
  if(pend()){if(!cats.length&&!prods.length){const c=load('pos3_cache',null);if(c)({cos,users,cats,prods,sales,expenses,moves,logs,rets,branches,session}=c)}return}
  try{const r=await api('GET','/api/data',null,q);cos=[r.company];users=r.users;cats=r.cats;prods=r.prods;sales=r.sales;expenses=r.expenses||[];branches=r.branches||[];rets=r.rets||[];moves=r.moves||[];logs=r.logs||[];session=r.me;cacheState()}
  catch(e){const c=load('pos3_cache',null);if(e.net&&c&&token)({cos,users,cats,prods,sales,expenses,moves,logs,rets,branches,session}=c);else throw e}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR=()=>{try{return (C&&C.cur)||'$'}catch(e){return '$'}};
const nf=n=>(Number(n)||0).toLocaleString('en-US');
const money=n=>{n=Number(n)||0;const y=CUR(),x=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'-':'')+(y.length>1&&/[A-Za-z]$/.test(y)?y+' ':y)+x};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const day=ts=>new Date(ts).toLocaleDateString('en-CA');
const $=s=>document.querySelector(s);
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pos2:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('pos2:'+s)))}}
function toast(m,type){type=type||(/not |cannot|fail|invalid|only |less than|exists|remove|insufficient|no in-stock|type a/i.test(m)?'warn':'ok');
  let h=document.getElementById('toasts');if(!h){h=document.createElement('div');h.id='toasts';h.className='toasts';document.body.appendChild(h)}
  const t=document.createElement('div');t.className='toast t-'+type;t.innerHTML='<span>'+({ok:'✔',warn:'⚠',err:'✖'}[type])+'</span>'+esc(m);h.appendChild(t);setTimeout(()=>t.remove(),2600)}

const PERM={admin:['sell','products','stock','report','users','expenses','history','lowstock','stockrep','audit','backup','branches'],manager:['sell','products','stock','report','expenses','history','lowstock','stockrep'],cashier:['sell','stock','lowstock']};
const TABS={sell:'Sell',products:'Products',stock:'Stock',report:'Reports',users:'Users',expenses:'Expenses',history:'Stock history',lowstock:'Low stock',stockrep:'Stock report',audit:'Audit log',backup:'Backup & export',branches:'Branches'};
let cos=[],users=[],cats=[],prods=[],sales=[],expenses=[],moves=[],logs=[],rets=[],recovery='',branches=[],curBr='',imp=null;
let session=null,mode='login',err='',tab='sell',cart=[],filt='',from='',to='',wk=0,rc=null,U=null,C=null,q='',pg={},ps=10,md=null,mdx=null,disc={on:false,type:'%',val:''},pays=[{m:'Cash',amt:'',ref:''}],pay='Cash',paid='',cust={name:'',phone:'',note:''};
const mine=a=>a.filter(x=>x.co===C.code);
const cmine=mine;
const bmine=a=>a.filter(x=>x.co===C.code&&(curBr==='all'||x.br===curBr));
const allowedBr=()=>U.role==='admin'?branches.map(b=>b.id):(U.br||[]);
const brName=id=>(branches.find(b=>b.id===id)||{name:'-'}).name;
const BR=()=>curBr==='all'?(allowedBr()[0]||''):curBr;
const BONLY=['sell','products','stock'];
function pickBr(){const al=allowedBr(),sv=load('pos3_br_'+U.id,null);curBr=(sv==='all'&&al.length>1)||al.includes(sv)?sv:(al[0]||'')}
const BRCK=sel=>branches.map(b=>`<label class="chk"><input type="checkbox" name="br_${b.id}" ${sel.includes(b.id)?'checked':''}> ${esc(b.name)}</label>`).join('');
const can=p=>PERM[U.role].includes(p);
const PAY=[['Cash','💵'],['Mobile Money','📱'],['Card','💳'],['Bank','🏦']];
const cartSub=()=>cart.reduce((x,c)=>x+c.price*c.qty,0);
const discAmt=()=>{if(!disc.on)return 0;const s=cartSub(),p=pays.reduce((x,q)=>x+(+q.amt||0),0);if(p<=0||p>=s)return 0;return Math.round((s-p)*100)/100};
const cartTotal=()=>Math.max(0,cartSub()-discAmt());
function updTot(){const a=$('#dsc'),t=$('#tot'),b=$('#bal');if(a)a.textContent='-'+money(discAmt());if(t)t.textContent=money(cartTotal());if(b)b.textContent=balText()}
function balText(){if(disc.on){const p=pays.reduce((x,q)=>x+(+q.amt||0),0);return p<=0?'Enter the amount paid':discAmt()>0?'Discount '+money(discAmt()):p>cartSub()?'Change '+money(p-cartSub()):'Fully paid'}const t=cartTotal(),s=pays.reduce((x,p)=>x+(+p.amt||0),0);if(pays.length===1&&!s)return '';const b=t-s;return b>0.004?'Remaining '+money(b):b<-0.004?'Change '+money(-b):'Fully paid'}
function payParts(s){if(!s.pays)return [[s.pay||'Cash',s.total]];let ch=s.change||0;return s.pays.map(p=>{let a=p.amt;if(p.m==='Cash'&&ch>0){const d=Math.min(ch,a);a-=d;ch-=d}return [p.m,a]})}
function persistSale(op,s){return op==='del'?api('DELETE','/api/sales/'+s.id):api('PATCH','/api/sales/'+s.id,{ts:s.ts})}
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

const CAM='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const loadZX=()=>window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function scan(cb){

  if(c==='sp'){mdx=t.value}
  if(c==='pm'){const p=pays[+t.dataset.i];if(p)p.m=t.value}
  if(c==='cu'){cust[t.dataset.f]=t.value;return}
  if(c==='cq'){const l=cart.find(x=>x.id===id),p=prods.find(x=>x.id===id);if(l&&p){let v=parseInt(t.value)||0;if(v>p.stock){v=p.stock;toast('Only '+p.stock+' in stock','warn')}if(v<1)cart=cart.filter(x=>x!==l);else l.qty=v}}
  if(c==='filt'){filt=t.value;pg.sell=1}if(c==='ps'){ps=+t.value;pg={}}if(c==='from'){from=t.value;pg.tx=pg.dp=1}if(c==='to'){to=t.value;pg.tx=pg.dp=1}
  if(c==='cp'){const l=cart.find(x=>x.id===id),v=Math.max(0,+t.value||0);if(l)return ask('Change the selling price to '+money(v)+' for this sale?',()=>{l.price=v;toast('Price changed for this sale')},true)}
  if(c==='pe'&&U&&can('products')&&t.dataset.f==='code'){const p=prods.find(x=>x.id===id),v=t.value.trim();
    if(p){if(v&&bmine(prods).some(x=>x.id!==id&&x.code===v)){toast('Barcode already used by another product','warn');return render()}
      return ask('Set the barcode of '+dn(p)+' to '+(v||'none')+'?',()=>{p.code=v;save(K.p,prods);toast('Barcode saved')},true)}}
  if(c==='pe'&&U&&can('products')){const p=prods.find(x=>x.id===id),v=Math.max(0,+t.value||0),f=t.dataset.f;if(p)return ask('Change the '+(f==='buy'?'buying':'selling')+' price of '+p.name+' to '+money(v)+'?',()=>{p[f]=v;save(K.p,prods);audit('Price changed',dn(p)+' '+(f==='buy'?'buying':'selling')+' price to '+money(v));toast('Price updated')},true)}
  if(c==='role'&&U&&can('users')){const u=users.find(x=>x.id===id),v=t.value;if(u&&u.co===C.code)return ask('Change '+u.name+' to '+v+'?',async()=>{await api('PATCH','/api/users/'+u.id,{role:v});audit('Role changed',u.user+' to '+v);u.role=v;toast('Role updated')},true)}
  render();
});
document.addEventListener('click',e=>{
  if(e.target.classList.contains('drbg')){dr=false;return render()}
  if(e.target.classList.contains('modal')){if(md==='rec')return;if(md)md=null;else rc=null;return render()}
  const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='mode'){mode=mode==='login'?'reg':'login';err=''}
  if(a==='scan')return scan(code=>{const p=findCode(code);if(!p)toast('No product with barcode '+code,'warn');else if(p.stock<1)toast('Out of stock: '+dn(p),'warn');else addCart(p);render()});
  if(a==='scanfield')return scan(code=>{const i=$('#'+id);if(i)i.value=code});
  if(a==='mode2'){mode=id;err=''}
  if(a==='hold'){if(!cart.length)return;const h=getHeld(),lbl=cust.name||cust.phone||('Sale '+(h.length+1));h.push({id:uid(),ts:Date.now(),label:lbl,cart,cust,disc,total:cartTotal()});save(heldKey(),h);cart=[];cust={name:'',phone:'',note:''};disc={on:false,type:'%',val:''};pays=[{m:'Cash',amt:'',ref:''}];toast('Sale held: '+lbl)}
  if(a==='resume'){const h=getHeld(),x=h.find(i=>i.id===id);if(!x)return;const go=()=>{cart=x.cart;cust=x.cust||{name:'',phone:'',note:''};disc=x.disc||{on:false,type:'%',val:''};save(heldKey(),h.filter(i=>i.id!==id));md=null;toast('Sale resumed')};if(cart.length)return ask('Replace the current cart with this held sale?',go);go()}
  if(a==='delheld')return ask('Delete this held sale?',()=>{save(heldKey(),getHeld().filter(i=>i.id!==id));toast('Held sale deleted')});
  if(a==='delexp')return ask('Delete this expense?',()=>{const e=expenses.find(x=>x.id===id);if(e)audit('Expense deleted',e.cat+' · '+money(e.amt));expenses=expenses.filter(x=>x.id!==id);save(K.e,expenses);toast('Expense deleted')});
  if(a==='exp')return exportCSV(id.replace('-all',''),id.endsWith('-all'));
  if(a==='sharelow'){const L=bmine(prods).filter(p=>p.stock<=lowN).sort((x,y)=>x.stock-y.stock);if(!L.length)return toast('Nothing is running low');const txt=C.name+' - low stock ('+day(Date.now())+')\n'+L.map(p=>'- '+dn(p)+': '+(p.stock<1?'OUT':p.stock)).join('\n');if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('List copied'));else toast('Sharing is not supported here','warn');return}
  if(a==='backupjson'){dlFile('pos-backup-'+C.code+'-'+day(Date.now())+'.json',JSON.stringify({v:1,company:C.code,at:new Date().toISOString(),branches:branches,fields:C.fields||[],cats:cmine(cats),prods:cmine(prods),sales:cmine(sales),expenses:cmine(expenses),moves:cmine(moves),logs:cmine(logs),rets:cmine(rets)}),'application/json');toast('Backup downloaded');return}
  if(a==='restore'){const f=$('#rf')&&$('#rf').files[0];if(!f)return toast('Choose a backup file first','warn');
    f.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch(x){return toast('That file is not a valid backup','err')}if(d.v!==1||!Array.isArray(d.prods))return toast('That file is not a POS backup','err');
      ask('Restore backup from '+(d.at?d.at.slice(0,10):'file')+'? This REPLACES all current data for this company.',async()=>{await api('POST','/api/restore',d);await boot();audit('Backup restored','from '+(d.at||'file'));toast('Backup restored')})});return}
  if(a==='recov')return ask('Generate a new recovery code? The old one will stop working.',async()=>{const r=await api('POST','/api/recovery');recovery=r.code;md='rec';dr=false});
  if(a==='yr')yr=Math.min(new Date().getFullYear(),yr+ +id);
  if(a==='setbr'){const go=()=>{curBr=id;save('pos3_br_'+U.id,id);if(id==='all'&&BONLY.includes(tab))tab='report';dr=false;cart=[];toast('Branch: '+(id==='all'?'All branches':brName(id)))};
    if(id===curBr){dr=false}else if(cart.length)return ask('Switching branch clears the current cart. Continue?',go);else go()}
  if(a==='delbr')return ask('Delete branch "'+brName(id)+'"? It must have no products or sales.',async()=>{await api('DELETE','/api/branches/'+id);const nm=brName(id);branches=branches.filter(b=>b.id!==id);users.forEach(u=>{u.br=(u.br||[]).filter(x=>x!==id)});if(curBr===id)pickBr();audit('Branch deleted',nm);toast('Branch deleted')});
  if(a==='delfld')return ask('Delete this column? Its values stay in your data but are no longer shown.',async()=>{const f=(C.fields||[]).find(x=>x.id===id),r=await api('PATCH','/api/company/fields',{fields:(C.fields||[]).filter(x=>x.id!==id)});C.fields=r.fields;cacheState();audit('Custom column deleted',f?f.name:id);toast('Column deleted')});
  if(a==='imptpl'){const fl=FLD('prod').map(f=>f.name);return dl('product-import-template',[['Category','Product','Barcode','Buying price','Selling price','Stock',...fl],['Drinks','Cola 500ml','5449000000996',0.5,1,24,...fl.map(()=>'')],['Snacks','Salted chips','',0.8,1.5,40,...fl.map(()=>'')]])}
  if(a==='impread'){const f=$('#impf')&&$('#impf').files[0];if(!f)return toast('Choose a file first','warn');
    const done=rows=>{if(rows.length<2)return toast('The file has no data rows','warn');imp={fname:f.name,headers:rows[0].map(x=>String(x).trim()),rows:rows.slice(1),mode:'add'};imp.map=autoMap(imp.headers);render()};
    if(/\.xlsx?$/i.test(f.name))loadXLSX().then(()=>f.arrayBuffer()).then(buf=>{const wb=XLSX.read(buf),ws=wb.Sheets[wb.SheetNames[0]];done(XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}))}).catch(()=>toast('Could not read the Excel file (it needs internet). Save it as CSV and try again.','err'));
    else f.text().then(t=>done(parseCSV(t)));return}
  if(a==='impgo'&&imp){const n=impPlan().filter(x=>!x.err).length;return ask('Import '+n+' rows into '+brName(curBr)+'?',()=>{const[nn,uu,nc]=impApply();imp=null;md=null;toast('Imported '+nn+' new, updated '+uu+(nc?', '+nc+' new categories':''))})}
  if(a==='recdone'){md=null;recovery=''}
  if(a==='showpw'){showpw=!showpw;document.querySelectorAll('input[data-pw]').forEach(i=>i.type=showpw?'text':'password');document.querySelectorAll('[data-act=showpw]').forEach(x=>x.innerHTML=showpw?EYEOFF:EYE);return}
  if(a==='print')return window.print();
  if(!U&&a!=='mode'&&a!=='mode2')return;
  if(a==='logout')return ask('Log out now?',()=>{dr=false;lk=false;session=null;cart=[];rc=null;try{localStorage.removeItem('pos3_token');token='';cos=[];users=[];cats=[];prods=[];sales=[]}catch(x){}});
  if(a==='filt'){filt=id;pg.sell=1}
  if(a==='addpay'){const u=pays.map(p=>p.m),n=PAY.map(m=>m[0]).find(m=>!u.includes(m))||'Cash';pays.push({m:n,amt:'',ref:''})}
  if(a==='lockn'){if(!lockCfg())return toast('Set a PIN first','warn');lk=true;dr=false}
  if(a==='rmpin'){if(!lockCfg())return;return ask('Remove the PIN lock?',()=>{try{localStorage.removeItem(lockKey())}catch(e){}dr=false;toast('PIN removed')})}
  if(a==='dtoggle'){disc.on=!disc.on;if(!disc.on)disc.val=''}
  if(a==='rmpay')pays.splice(+id,1);
  if(a==='qadd'){const nm=($('#qn').value||'').trim().toLowerCase(),qty=Math.max(1,parseInt($('#qq').value)||1),av=bmine(prods).filter(x=>x.stock>0);
    let p=av.find(x=>x.code&&x.code.toLowerCase()===nm)||av.find(x=>dn(x).toLowerCase()===nm);if(!p&&nm){const m=av.filter(x=>dn(x).toLowerCase().includes(nm));if(m.length===1)p=m[0]}
    if(p)addCart(p,qty);else toast(!nm?'Type a product name first':av.some(x=>dn(x).toLowerCase().includes(nm))?'Several products match - choose one from the list':'No in-stock product matches that name','warn')}
  if(a==='tab'&&can(id)){tab=id;err='';md=null;dr=false}
  if(a==='wk')wk=Math.max(0,wk+ +id);
  if(a==='closer')rc=null;
  if(a==='delrcpt'&&can('report')){const sl=sales.find(x=>x.id===id);if(!sl)return;
    return ask('Delete receipt #'+sl.no+' ('+money(sl.total)+')? Its items will be returned to stock.',async()=>{
      const keep=sales;sales=sales.filter(x=>x.id!==id);try{await persistSale('del',sl)}catch(e){sales=keep;throw e}
      const ms=[];sl.items.forEach(i=>{const p=prods.find(x=>x.id===i.id);if(p){p.stock+=i.qty;ms.push(mv(p,i.qty,'void','#'+sl.no+' deleted'))}});save(K.p,prods);if(ms.length)rec('moves',ms);audit('Receipt deleted','#'+sl.no+' · '+money(sl.total));if(rc===id)rc=null;toast('Receipt deleted')})}if(a==='open'&&id==='import')imp=null;
  if(a==='open'&&curBr==='all'&&['import','catedit','prodedit','cat','prod','stock','adj','exp','held','sprods','cprods','xfer'].includes(id))return toast('Choose a branch first (Settings > Branch)','warn');
  if(a==='open'){md=id;mdx=b.dataset.x||null;err='';dr=false;mq=''}if(a==='drawer')dr=true;if(a==='closed')dr=false;if(a==='theme'){theme=id;save('pos2_theme',theme);applyTheme()}if(a==='closem')md=null;if(a==='pg'){const[k,n]=id.split(':');pg[k]=(pg[k]||1)+ +n}
  if(a==='rcpt')rc=id;
  if(a==='add'){const p=prods.find(x=>x.id===id);if(p)addCart(p)}
  if(a==='dec'){const l=cart.find(x=>x.id===id);if(l&&--l.qty<1)cart=cart.filter(x=>x!==l)}
  if(a==='clear')return ask('Clear all items from the cart?',()=>{cart=[];paid='';disc={on:false,type:'%',val:''};pays=[{m:'Cash',amt:'',ref:''}];cust={name:'',phone:'',note:''};toast('Cart cleared')});
  if(a==='checkout'){if(!cart.length)return toast('Cart is empty','warn');
    if(disc.on&&!pays.some(p=>+p.amt>0))return toast('Enter the amount the customer is paying','warn');
    const tot=cartTotal(),gv=i=>($(i)||{value:''}).value.trim(),cu={name:gv('#cn'),phone:gv('#cp'),note:gv('#cnt')};
    let pp=pays.map(p=>({m:p.m,amt:+p.amt||0,ref:(p.ref||'').trim()}));
    if(pp.length===1&&!pp[0].amt)pp[0].amt=tot;
    const sum=pp.reduce((x,p)=>x+p.amt,0),cash=pp.filter(p=>p.m==='Cash').reduce((x,p)=>x+p.amt,0);
    if(sum<tot-0.004)return toast('Payments are short by '+money(tot-sum),'warn');
    const chg=Math.max(0,sum-tot);
    if(chg>cash+0.004)return toast('Card, mobile and bank payments cannot exceed the total','warn');
    pp=pp.filter(p=>p.amt>0);
    return ask('Complete this '+(pp.length>1?'split-payment':pp[0].m)+' sale of '+money(tot)+'?',()=>{
      const items=[];let total=0,profit=0;
      for(const c of cart){const p=prods.find(x=>x.id===c.id);if(!p||p.stock<c.qty){toast('Insufficient stock: '+(p?p.name:'item'),'warn');return}
        items.push({id:p.id,name:dn(p),price:c.price,buy:p.buy,qty:c.qty});total+=c.price*c.qty;profit+=(c.price-p.buy)*c.qty}
      if(!items.length)return;
      const dd=discAmt(),sub=total;total=Math.round((total-dd)*100)/100;profit-=dd;
      items.forEach(i=>{prods.find(p=>p.id===i.id).stock-=i.qty});
      const s={id:uid(),co:C.code,br:BR(),no:Math.max(0,...bmine(sales).map(x=>x.no||0))+1,ts:Date.now(),by:U.name,items,total,profit,disc:dd,sub,pay:pp.length>1?'Split':pp[0].m,pays:pp,paid:sum,change:chg,cust:(cu.name||cu.phone||cu.note)?cu:null};
      sales.push(s);save(K.p,prods);save(K.l,sales);rec('moves',items.map(i=>mv(prods.find(p=>p.id===i.id),-i.qty,'sale','#'+s.no)));cart=[];rc=s.id;paid='';disc={on:false,type:'%',val:''};pays=[{m:'Cash',amt:'',ref:''}];cust={name:'',phone:'',note:''};toast('Sale completed: '+money(total)+' ('+s.pay+')');
      const low=items.map(i=>prods.find(p=>p.id===i.id)).filter(p=>p.stock<=5);
      if(low.length)setTimeout(()=>toast('Low stock: '+low.map(p=>p.name+' ('+p.stock+')').join(', '),'warn'),700);
    });}
  if(a==='delcat'&&can('products')){if(prods.some(p=>p.cat===id))return toast('Remove its products first');return ask('Delete this category?',()=>{audit('Category deleted',catName(id));cats=cats.filter(c=>c.id!==id);save(K.g,cats);toast('Category deleted')})}
  if(a==='delprod'&&can('products'))return ask('Delete this product?',()=>{const pp=prods.find(x=>x.id===id);if(pp)audit('Product deleted',dn(pp));prods=prods.filter(p=>p.id!==id);cart=cart.filter(c=>c.id!==id);save(K.p,prods);toast('Product deleted')});
  if(a==='deluser'&&can('users')&&id!==U.id)return ask('Delete this user?',async()=>{const uu=users.find(x=>x.id===id);await api('DELETE','/api/users/'+id);audit('User deleted',uu?uu.user:id);users=users.filter(u=>u.id!==id);toast('User deleted')});
  render();
});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.input;
  if(k==='mq'){mq=t.value;const p=t.selectionStart;render();const n=$('#mq');if(n){n.focus();n.setSelectionRange(p,p)}return}
  if(k==='dv'){disc.val=t.value;updTot();return}
  if(k==='pa'||k==='pr'){const p=pays[+t.dataset.i];if(p){p[k==='pa'?'amt':'ref']=t.value;if(k==='pa')updTot()}return}
  if(k!=='q')return;q=t.value;pg.sell=pg.scat=1;const p=t.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){const p=findCode(e.target.value);if(p){e.preventDefault();if(p.stock>0)addCart(p);else toast('Out of stock: '+dn(p),'warn');q='';pg.sell=pg.scat=1;render()}}
  if(e.key==='Enter'&&e.target.id==='qn'){e.preventDefault();const b=document.querySelector('[data-act=qadd]');if(b)b.click()}});
applyTheme();
render();
if(token)boot().then(render).catch(e=>{if(!e.net){token='';try{localStorage.removeItem('pos3_token')}catch(x){}}render()});
window.addEventListener('online',()=>{if(token)boot(true).then(render).catch(()=>render())});window.addEventListener('offline',()=>render());
setInterval(()=>{if(token&&pend()&&navigator.onLine)flushQ().then(()=>render())},20000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
setInterval(()=>{if(token&&U&&!md&&!rc&&!dr&&!lk&&!document.querySelector('.cfm')&&!['INPUT','SELECT'].includes(document.activeElement.tagName))boot(true).then(render).catch(()=>{})},30000);
