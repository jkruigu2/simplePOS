<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple POS</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0e7c66"><link rel="icon" href="/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1f4f6;--card:#fff;--tx:#0f1b2d;--mut:#5d6b7c;--bd:#dde3e9;--pri:#0e7c66;--pri2:#0a6552;--pritx:#fff;--soft:#e6f4f0;--ok:#0e7c66;--bad:#c0392b;--warn:#b7791f;--tl:92%;--tt:28%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--pri2:#26a588;--pritx:#06201a;--soft:#12332c;--ok:#2fbf9b;--bad:#f0776a;--warn:#e0b04a;--tl:22%;--tt:82%}}
:root[data-theme="dark"]{--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--pri2:#26a588;--pritx:#06201a;--soft:#12332c;--ok:#2fbf9b;--bad:#f0776a;--warn:#e0b04a;--tl:22%;--tt:82%}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 104px}
h1{font-size:18px;margin:0;font-weight:600}h2{font-size:16px;margin:0 0 12px;font-weight:600}
nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--bd);margin:0 -14px 14px;padding:0 10px 0 14px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav button{height:50px;padding:0 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mut);font-weight:500;white-space:nowrap}
nav button:hover:not(:disabled){background:none;border-color:transparent;border-bottom-color:var(--bd);color:var(--tx)}
nav button.act{color:var(--pri);border-bottom-color:var(--pri);background:none}
nav .gear{height:40px;width:40px;padding:0;border:1px solid var(--bd);border-radius:8px;font-size:18px;color:var(--tx);background:var(--card);flex-shrink:0}
nav .gear:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
.cart{border-top:3px solid var(--pri)}#tot{font-size:28px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid.two{grid-template-columns:1.3fr 1fr}.grid.half{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{margin-bottom:0}
button{font:inherit;height:38px;padding:0 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
button.pri:hover:not(:disabled){background:var(--pri2);border-color:var(--pri2)}
button.act{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
button.del{color:var(--bad)}button.del:hover:not(:disabled){background:rgba(192,57,43,.08);border-color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
td button{height:30px;padding:0 10px;font-size:13px}.qty button{height:30px;padding:0 10px}
input,select{font:inherit;color:inherit;width:100%;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-bottom:8px}
input[type=checkbox]{width:auto;height:auto}
td input,td select{height:34px;margin:0;padding:0 8px;width:88px}
label{font-size:13px;color:var(--mut);font-weight:500}
.tblw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px;background:var(--bg)}
tbody tr:last-child td,tr:last-child>td{border-bottom:0}
tr:hover>td{background:var(--soft)}
tfoot td{font-weight:600;border-top:2px solid var(--bd);border-bottom:0;background:var(--bg)}
.r{text-align:right}.mut{color:var(--mut)}.low{color:var(--warn);font-weight:600}.out,.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.tblw>p{padding:14px;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);padding:12px 14px}.stat span{font-size:13px}.stat b{display:block;font-size:22px;font-weight:600}
.tag{display:inline-block;background:hsl(var(--h) 55% var(--tl));color:hsl(var(--h) 60% var(--tt));border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:600}
.cr td:first-child{border-left:4px solid hsl(var(--h) 60% 48%);padding-left:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{height:34px;padding:0 13px;border-radius:8px;white-space:nowrap;font-size:13.5px;border:1px solid hsl(var(--h,200) 40% 60%/.5);background:hsl(var(--h,200) 50% var(--tl));color:hsl(var(--h,200) 60% var(--tt))}
.chip.on{background:hsl(var(--h,200) 55% 36%);color:#fff;border-color:transparent}
.badge{background:var(--soft);color:var(--pri);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
.logo{width:52px;height:52px;border-radius:12px;background:var(--pri);display:grid;place-items:center;font-size:26px;margin:0 auto 10px}
.auth{max-width:420px;margin:8vh auto 0;padding:24px}.ctr{text-align:center}.err{color:var(--bad);min-height:20px;font-size:14px}
.prow{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.prow select{width:135px;margin:0}.prow input{flex:1;min-width:90px;margin:0}
.qty{display:flex;gap:6px;align-items:center}.qty input{width:58px;text-align:center;padding:0 4px;height:30px}
.dh{font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}
.modal,.cfm{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}
.modal>.card,.cfm>.card{box-shadow:0 20px 50px rgba(0,0,0,.3);border-radius:12px;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.receipt{width:var(--rw,80mm);max-width:100%;font-size:13px;background:#fff;color:#111;border-color:#e5e7eb;font-family:ui-monospace,Menlo,monospace}.receipt.p58{--rw:58mm}.receipt.p80{--rw:80mm}.receipt.pa4{--rw:190mm}.receipt.fsans{font-family:'IBM Plex Sans',system-ui,sans-serif}.receipt.zs{font-size:11px}.receipt.zm{font-size:13px}.receipt.zl{font-size:15px}.rtitle{font-size:1.25em}.rlogo{display:block;margin:0 auto 6px;max-width:75%;max-height:90px}
textarea{font:inherit;color:inherit;width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-bottom:8px;resize:vertical}
.receipt hr{border:0;border-top:1px dashed #999}.receipt .mut{color:#666}.receipt tr:hover>td{background:none}
.drbg{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:310px;max-width:86vw;height:100%;background:var(--card);border-left:1px solid var(--bd);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(100%)}}
.dcard{background:var(--soft);border-radius:10px;padding:12px}
.ditem{display:flex;gap:10px;align-items:center;width:100%;height:44px;text-align:left;margin-bottom:6px}.ditem span{font-size:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none}
.toast{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .18s;max-width:90vw}
.toast span{margin-right:8px;font-weight:700;color:var(--ok)}.t-warn span{color:var(--warn)}.t-err span{color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ld{position:fixed;inset:0;background:rgba(10,20,30,.5);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:200;color:#fff;font-weight:600}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg text{fill:var(--mut);font-size:9px}svg .b1{fill:var(--pri)}svg .b2{fill:var(--warn)}
.pw{position:relative;margin-bottom:8px}.pw input{margin:0;padding-right:46px}.pw button{position:absolute;right:4px;top:4px;height:34px;width:36px;padding:0;display:grid;place-items:center;border:0;background:none;color:var(--mut)}.pw button:hover:not(:disabled){background:var(--soft);color:var(--tx)}
.tb{display:flex;justify-content:flex-end;margin-bottom:6px}.cols{position:relative}.cols summary{cursor:pointer;font-size:13px;color:var(--mut);list-style:none;padding:5px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}.cols summary::-webkit-details-marker{display:none}
.colbox{position:absolute;right:0;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:180px}.colbox label{display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--tx);font-size:14px}.colbox input{width:auto;height:auto;margin:0}
.pgr{margin-top:8px}th.srt{cursor:pointer;user-select:none}th.srt::after{content:'↕';opacity:.35;margin-left:5px}th[data-s="1"]::after{content:'↑';opacity:1}th[data-s="-1"]::after{content:'↓';opacity:1}
tr.exm td{opacity:.5}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;padding:4px 0}.chk input{width:auto;height:auto;margin:0}
.mini{display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;margin-bottom:12px}.mini button{border:0;height:34px;border-radius:7px;background:none;white-space:nowrap;color:var(--mut);font-weight:500}.mini button:hover:not(:disabled){background:var(--soft);border:0}.mini button.act{background:var(--pri);color:var(--pritx)}
.hb{display:grid;grid-template-columns:minmax(80px,36%) 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:14px}.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar{background:var(--bg);border-radius:6px;height:12px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--pri)}
.vb{display:flex;align-items:flex-end;gap:2px;height:130px;margin-bottom:6px}.vb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.vb i{width:100%;background:var(--pri);border-radius:3px 3px 0 0;min-height:1px}.vb small{font-size:9px;color:var(--mut)}
.brandbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:0 auto 14px;max-width:300px}.brand{display:block;width:100%;height:auto}
.gh{font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 2px}.gr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.gr:last-child{border-bottom:0}.gr small{display:block}
.sbar{background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}.sbar.bad{background:rgba(192,57,43,.12);border-color:var(--bad);color:var(--bad)}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:300}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@page{margin:2mm}
@media print{body *{visibility:hidden}.modal,.receipt,.receipt *{visibility:visible}.modal{position:absolute;background:none;padding:0;display:block}.receipt{border:0;max-width:none;box-shadow:none;margin:0;padding:1mm}.noprint{display:none!important}.ld{display:none}}
</style>

<body>
<div class="wrap" id="app"></div>
<script>
const K={c:'pos2_co',u:'pos2_users',s:'pos2_session',g:'pos2_cats',p:'pos2_prods',l:'pos2_sales',e:'pos2_exp'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let token='';try{token=localStorage.getItem('pos3_token')||''}catch(e){}
const APPEND=['/api/sales','/api/moves','/api/logs','/api/rets','/api/ledger'],UPS=['/api/lays','/api/custs'];
const pend=()=>load('pos3_q',[]).length;
const pill=()=>navigator.onLine&&!pend()?'':`<span class="badge" style="background:var(--warn);color:#fff">${navigator.onLine?'Syncing '+pend():'Offline'+(pend()?' · '+pend()+' waiting':'')}</span>`;
function cacheState(){try{localStorage.setItem('pos3_cache',JSON.stringify({cos,users,cats,prods,sales,expenses,moves,logs,rets,branches,custs,lays,bals,subinfo,session}))}catch(e){}}
async function raw(m,p,b){let r;try{r=await fetch((window.POS_API||'')+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined})}catch(x){const e=new Error('You are offline - connect to the internet and try again');e.net=true;throw e}
  const j=await r.json().catch(()=>({}));if(r.status===402&&j.code==='SUB_EXPIRED'){subBlock={sub:j.sub||{},contact:j.contact||''};const e=new Error(j.error||'Subscription expired');e.sub=true;setTimeout(render,0);throw e}
  if(!r.ok)throw new Error(j.error||(r.status===404||r.status===405?'Server is missing this feature - deploy the latest server.js':'Request failed ('+r.status+')'));return j}
function enqueue(m,p,b){let q=load('pos3_q',[]);
  if(APPEND.includes(p)){const e=q.find(x=>x.p===p);if(e){const ids=new Set(e.b.map(x=>x.id));b.forEach(x=>{if(!ids.has(x.id))e.b.push(x)})}else q.push({m,p,b:[...b]})}
  else if(UPS.includes(p)){const e=q.find(x=>x.p===p);if(e)b.forEach(x=>{const i=e.b.findIndex(y=>y.id===x.id);if(i<0)e.b.push(x);else e.b[i]=x});else q.push({m,p,b:[...b]})}
  else{q=q.filter(x=>x.p!==p);q.push({m,p,b})}
  try{localStorage.setItem('pos3_q',JSON.stringify(q))}catch(e){}}
async function flushQ(){let q=load('pos3_q',[]);
  while(q.length){const e=q[0];try{await raw(e.m,e.p,e.b)}catch(x){if(x.net||x.sub)return false;toast(x.message,'err')}q.shift();try{localStorage.setItem('pos3_q',JSON.stringify(q))}catch(x){}}return true}
let nb=0;
function busy(on,m){nb=Math.max(0,nb+(on?1:-1));let e=document.getElementById('ld');
  if(nb>0&&!e){e=document.createElement('div');e.id='ld';e.className='ld';e.innerHTML='<div class="spin"></div><div id="ldt"></div>';document.body.appendChild(e)}
  if(e&&on)document.getElementById('ldt').textContent=m==='GET'?'Loading…':'Saving…';
  if(nb===0&&e)e.remove()}
async function api(m,p,b,quiet,queue){if(!quiet)busy(true,m);
  try{if(queue&&!navigator.onLine){enqueue(m,p,b);return{queued:1}}
    try{return await raw(m,p,b)}catch(e){if((e.net||e.sub)&&queue){enqueue(m,p,b);return{queued:1}}throw e}}
  finally{if(!quiet)busy(false)}}
const ROUTE={[K.g]:'cats',[K.p]:'prods',[K.l]:'sales',[K.e]:'expenses'};
const save=(k,v)=>{if(ROUTE[k]){api('PUT','/api/'+ROUTE[k],k===K.l?v.slice(-1):v,false,true).catch(e=>toast(e.message,'err'));cacheState()}else try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function boot(q){
  await flushQ();
  if(pend()){if(!cats.length&&!prods.length){const c=load('pos3_cache',null);if(c)({cos,users,cats,prods,sales,expenses,moves,logs,rets,branches,custs=[],lays=[],bals={},subinfo=null,session}=c)}return}
  try{const r=await api('GET','/api/data?days=35',null,q);
    const wn=r.win||0,keep=(a,w)=>loadedFrom!==null&&loadedFrom<w?a.filter(x=>x.ts<w):[];   // older records loaded earlier are kept (no window = everything was sent)
    const oS=keep(sales,wn),oR=keep(rets,wn),oE=keep(expenses,wn);
    cos=[r.company];users=r.users;cats=r.cats;prods=r.prods;branches=r.branches||[];custs=r.custs||[];lays=r.lays||[];bals=r.bals||{};subinfo=r.subinfo||null;moves=r.moves||[];logs=r.logs||[];session=r.me;
    sales=[...r.sales,...oS];rets=[...(r.rets||[]),...oR];expenses=[...(r.expenses||[]),...oE];
    loadedFrom=loadedFrom===null?wn:Math.min(loadedFrom,wn);ver=r.v||{};['sales','moves','logs','rets','lays','custs'].forEach(k=>syncAt[k]=r.now);cacheState()}
  catch(e){const c=load('pos3_cache',null);if(e.net&&c&&token)({cos,users,cats,prods,sales,expenses,moves,logs,rets,branches,custs=[],lays=[],bals={},subinfo=null,session}=c);else throw e}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR=()=>{try{return (C&&C.cur)||'$'}catch(e){return '$'}};
const nf=n=>(Number(n)||0).toLocaleString('en-US');
const money=n=>{n=Number(n)||0;const y=CUR(),x=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'-':'')+(y.length>1&&/[A-Za-z]$/.test(y)?y+' ':y)+x};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const day=ts=>new Date(ts).toLocaleDateString('en-CA');
const $=s=>document.querySelector(s);
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pos2:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('pos2:'+s)))}}
function toast(m,type){type=type||(/not |cannot|fail|invalid|only |less than|exists|remove|insufficient|no in-stock|type a/i.test(m)?'warn':'ok');
  let h=document.getElementById('toasts');if(!h){h=document.createElement('div');h.id='toasts';h.className='toasts';document.body.appendChild(h)}
  const t=document.createElement('div');t.className='toast t-'+type;t.innerHTML='<span>'+({ok:'✔',warn:'⚠',err:'✖'}[type])+'</span>'+esc(m);h.appendChild(t);setTimeout(()=>t.remove(),2600)}

const PERM={admin:['sell','products','stock','report','users','expenses','history','lowstock','stockrep','prices','aged','customers','layaway','serials','audit','backup','branches'],manager:['sell','products','stock','report','expenses','history','lowstock','stockrep','prices','aged','customers','layaway','serials'],cashier:['sell','stock','lowstock','customers','layaway','serials']};
