<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1f4f6;--card:#fff;--tx:#0f1b2d;--mut:#5d6b7c;--bd:#dde3e9;--pri:#0e7c66;--pri2:#0a6552;--pritx:#fff;--soft:#e6f4f0;--ok:#0e7c66;--bad:#c0392b;--warn:#b7791f;--tl:92%;--tt:28%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--pri2:#26a588;--pritx:#06201a;--soft:#12332c;--ok:#2fbf9b;--bad:#f0776a;--warn:#e0b04a;--tl:22%;--tt:82%}}
:root[data-theme="dark"]{--bg:#0b1216;--card:#121c22;--tx:#e6edf1;--mut:#8ea0ad;--bd:#233039;--pri:#2fbf9b;--pri2:#26a588;--pritx:#06201a;--soft:#12332c;--ok:#2fbf9b;--bad:#f0776a;--warn:#e0b04a;--tl:22%;--tt:82%}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 104px}
h1{font-size:18px;margin:0;font-weight:600}h2{font-size:16px;margin:0 0 12px;font-weight:600}
nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--bd);margin:0 -14px 14px;padding:0 10px 0 14px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav button{height:50px;padding:0 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mut);font-weight:500;white-space:nowrap}
nav button:hover:not(:disabled){background:none;border-color:transparent;border-bottom-color:var(--bd);color:var(--tx)}
nav button.act{color:var(--pri);border-bottom-color:var(--pri);background:none}
nav .gear{height:40px;width:40px;padding:0;border:1px solid var(--bd);border-radius:8px;font-size:18px;color:var(--tx);background:var(--card);flex-shrink:0}
nav .gear:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
.cart{border-top:3px solid var(--pri)}#tot{font-size:28px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid.two{grid-template-columns:1.3fr 1fr}.grid.half{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{margin-bottom:0}
button{font:inherit;height:38px;padding:0 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:var(--soft);border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
button.pri:hover:not(:disabled){background:var(--pri2);border-color:var(--pri2)}
button.act{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
button.del{color:var(--bad)}button.del:hover:not(:disabled){background:rgba(192,57,43,.08);border-color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
td button{height:30px;padding:0 10px;font-size:13px}.qty button{height:30px;padding:0 10px}
input,select{font:inherit;color:inherit;width:100%;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-bottom:8px}
input[type=checkbox]{width:auto;height:auto}
td input,td select{height:34px;margin:0;padding:0 8px;width:88px}
label{font-size:13px;color:var(--mut);font-weight:500}
.tblw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px;background:var(--bg)}
tbody tr:last-child td,tr:last-child>td{border-bottom:0}
tr:hover>td{background:var(--soft)}
tfoot td{font-weight:600;border-top:2px solid var(--bd);border-bottom:0;background:var(--bg)}
.r{text-align:right}.mut{color:var(--mut)}.low{color:var(--warn);font-weight:600}.out,.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.tblw>p{padding:14px;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);padding:12px 14px}.stat span{font-size:13px}.stat b{display:block;font-size:22px;font-weight:600}
.tag{display:inline-block;background:hsl(var(--h) 55% var(--tl));color:hsl(var(--h) 60% var(--tt));border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:600}
.cr td:first-child{border-left:4px solid hsl(var(--h) 60% 48%);padding-left:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{height:34px;padding:0 13px;border-radius:8px;white-space:nowrap;font-size:13.5px;border:1px solid hsl(var(--h,200) 40% 60%/.5);background:hsl(var(--h,200) 50% var(--tl));color:hsl(var(--h,200) 60% var(--tt))}
.chip.on{background:hsl(var(--h,200) 55% 36%);color:#fff;border-color:transparent}
.badge{background:var(--soft);color:var(--pri);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
.logo{width:52px;height:52px;border-radius:12px;background:var(--pri);display:grid;place-items:center;font-size:26px;margin:0 auto 10px}
.auth{max-width:420px;margin:8vh auto 0;padding:24px}.ctr{text-align:center}.err{color:var(--bad);min-height:20px;font-size:14px}
.prow{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.prow select{width:135px;margin:0}.prow input{flex:1;min-width:90px;margin:0}
.qty{display:flex;gap:6px;align-items:center}.qty input{width:58px;text-align:center;padding:0 4px;height:30px}
.dh{font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}
.modal,.cfm{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}
.modal>.card,.cfm>.card{box-shadow:0 20px 50px rgba(0,0,0,.3);border-radius:12px;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.receipt{width:100%;max-width:340px;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fff;color:#111;border-color:#e5e7eb}
.receipt hr{border:0;border-top:1px dashed #999}.receipt .mut{color:#666}.receipt tr:hover>td{background:none}
.drbg{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:310px;max-width:86vw;height:100%;background:var(--card);border-left:1px solid var(--bd);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(100%)}}
.dcard{background:var(--soft);border-radius:10px;padding:12px}
.ditem{display:flex;gap:10px;align-items:center;width:100%;height:44px;text-align:left;margin-bottom:6px}.ditem span{font-size:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none}
.toast{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .18s;max-width:90vw}
.toast span{margin-right:8px;font-weight:700;color:var(--ok)}.t-warn span{color:var(--warn)}.t-err span{color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ld{position:fixed;inset:0;background:rgba(10,20,30,.5);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:200;color:#fff;font-weight:600}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg text{fill:var(--mut);font-size:9px}svg .b1{fill:var(--pri)}svg .b2{fill:var(--warn)}
.pw{position:relative;margin-bottom:8px}.pw input{margin:0;padding-right:46px}.pw button{position:absolute;right:4px;top:4px;height:34px;width:36px;padding:0;display:grid;place-items:center;border:0;background:none;color:var(--mut)}.pw button:hover:not(:disabled){background:var(--soft);color:var(--tx)}
.tb{display:flex;justify-content:flex-end;margin-bottom:6px}.cols{position:relative}.cols summary{cursor:pointer;font-size:13px;color:var(--mut);list-style:none;padding:5px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}.cols summary::-webkit-details-marker{display:none}
.colbox{position:absolute;right:0;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:180px}.colbox label{display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--tx);font-size:14px}.colbox input{width:auto;height:auto;margin:0}
.pgr{margin-top:8px}th.srt{cursor:pointer;user-select:none}th.srt::after{content:'↕';opacity:.35;margin-left:5px}th[data-s="1"]::after{content:'↑';opacity:1}th[data-s="-1"]::after{content:'↓';opacity:1}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:300}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body *{visibility:hidden}.modal,.receipt,.receipt *{visibility:visible}.modal{position:absolute;background:none;padding:0;display:block}.receipt{border:0;max-width:100%;box-shadow:none}.noprint{display:none!important}.ld{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const K={c:'pos2_co',u:'pos2_users',s:'pos2_session',g:'pos2_cats',p:'pos2_prods',l:'pos2_sales'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let token='';try{token=localStorage.getItem('pos3_token')||''}catch(e){}
let nb=0;
function busy(on,m){nb=Math.max(0,nb+(on?1:-1));let e=document.getElementById('ld');
  if(nb>0&&!e){e=document.createElement('div');e.id='ld';e.className='ld';e.innerHTML='<div class="spin"></div><div id="ldt"></div>';document.body.appendChild(e)}
  if(e&&on)document.getElementById('ldt').textContent=m==='GET'?'Loading…':'Saving…';
  if(nb===0&&e)e.remove()}
async function api(m,p,b,quiet){if(!quiet)busy(true,m);
  try{const r=await fetch((window.POS_API||'')+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||(r.status===404||r.status===405?'Server is missing this feature - deploy the latest server.js':'Request failed ('+r.status+')'));return j}
  finally{if(!quiet)busy(false)}}
const ROUTE={[K.g]:'cats',[K.p]:'prods',[K.l]:'sales'};
const save=(k,v)=>{if(ROUTE[k])api('PUT','/api/'+ROUTE[k],k===K.l?v.slice(-1):v).catch(e=>toast(e.message));else try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function boot(q){const r=await api('GET','/api/data',null,q);cos=[r.company];users=r.users;cats=r.cats;prods=r.prods;sales=r.sales;session=r.me}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Number(n)).toFixed(2);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const day=ts=>new Date(ts).toLocaleDateString('en-CA');
const $=s=>document.querySelector(s);
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pos2:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('pos2:'+s)))}}
function toast(m,type){type=type||(/not |cannot|fail|invalid|only |less than|exists|remove|insufficient|no in-stock|type a/i.test(m)?'warn':'ok');
  let h=document.getElementById('toasts');if(!h){h=document.createElement('div');h.id='toasts';h.className='toasts';document.body.appendChild(h)}
  const t=document.createElement('div');t.className='toast t-'+type;t.innerHTML='<span>'+({ok:'✔',warn:'⚠',err:'✖'}[type])+'</span>'+esc(m);h.appendChild(t);setTimeout(()=>t.remove(),2600)}

const PERM={admin:['sell','products','stock','report','users'],manager:['sell','products','stock','report'],cashier:['sell','stock']};
const TABS={sell:'Sell',products:'Products',stock:'Stock',report:'Reports',users:'Users'};
let cos=[],users=[],cats=[],prods=[],sales=[];
let session=null,mode='login',err='',tab='sell',cart=[],filt='',from='',to='',wk=0,rc=null,U=null,C=null,q='',pg={},ps=10,md=null,mdx=null,disc={on:false,type:'%',val:''},pays=[{m:'Cash',amt:'',ref:''}],pay='Cash',paid='',cust={name:'',phone:'',note:''};
const mine=a=>a.filter(x=>x.co===C.code);
const can=p=>PERM[U.role].includes(p);
const PAY=[['Cash','💵'],['Mobile Money','📱'],['Card','💳'],['Bank','🏦']];
const cartSub=()=>cart.reduce((x,c)=>x+c.price*c.qty,0);
const discAmt=()=>{if(!disc.on)return 0;const s=cartSub(),p=pays.reduce((x,q)=>x+(+q.amt||0),0);if(p<=0||p>=s)return 0;return Math.round((s-p)*100)/100};
const cartTotal=()=>Math.max(0,cartSub()-discAmt());
function updTot(){const a=$('#dsc'),t=$('#tot'),b=$('#bal');if(a)a.textContent='-'+money(discAmt());if(t)t.textContent=money(cartTotal());if(b)b.textContent=balText()}
function balText(){if(disc.on){const p=pays.reduce((x,q)=>x+(+q.amt||0),0);return p<=0?'Enter the amount paid':discAmt()>0?'Discount '+money(discAmt()):p>cartSub()?'Change '+money(p-cartSub()):'Fully paid'}const t=cartTotal(),s=pays.reduce((x,p)=>x+(+p.amt||0),0);if(pays.length===1&&!s)return '';const b=t-s;return b>0.004?'Remaining '+money(b):b<-0.004?'Change '+money(-b):'Fully paid'}
function payParts(s){if(!s.pays)return [[s.pay||'Cash',s.total]];let ch=s.change||0;return s.pays.map(p=>{let a=p.amt;if(p.m==='Cash'&&ch>0){const d=Math.min(ch,a);a-=d;ch-=d}return [p.m,a]})}
function persistSale(op,s){return op==='del'?api('DELETE','/api/sales/'+s.id):api('PATCH','/api/sales/'+s.id,{ts:s.ts})}
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

const CAM='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const loadZX=()=>window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function scan(cb){
  const ov=document.createElement('div');ov.className='cfm';ov.style.zIndex=430;
  ov.innerHTML='<div class="card" style="width:100%;max-width:420px;margin-top:6vh"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Scan barcode</h2><button id="scx">✕</button></div><video id="scv" playsinline muted style="width:100%;border-radius:8px;background:#000;min-height:180px"></video><p class="mut" id="scs" style="margin:8px 0">Starting camera…</p><div class="row"><input id="scm" placeholder="Or type the barcode" style="flex:1"><button class="pri" id="scok">Use</button></div></div>';
  document.body.appendChild(ov);
  let stream,reader,stop=false;
  const end=c=>{if(stop)return;stop=true;try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}try{reader&&reader.reset()}catch(e){}ov.remove();if(c)cb(c)};
  $('#scx').onclick=()=>end();$('#scok').onclick=()=>{const v=$('#scm').value.trim();if(v)end(v)};
  (async()=>{try{
    if(!navigator.mediaDevices)throw 0;
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector(),v=$('#scv');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();$('#scs').textContent='Point the camera at a barcode…';
      const tick=async()=>{if(stop)return;try{const r=await det.detect(v);if(r.length)return end(r[0].rawValue)}catch(e){}setTimeout(tick,250)};tick();
    }else{await loadZX();reader=new ZXing.BrowserMultiFormatReader();$('#scs').textContent='Point the camera at a barcode…';reader.decodeFromVideoDevice(null,'scv',r=>{if(r)end(r.getText())})}
  }catch(e){const m=$('#scs');if(m)m.textContent='Camera unavailable - type the barcode instead.'}})();
}
const findCode=v=>{v=String(v).trim().toLowerCase();return v&&mine(prods).find(x=>x.code&&x.code.toLowerCase()===v)};
const lockKey=()=>'pos3_lock_'+(U?U.id:'');
const lockCfg=()=>U?load(lockKey(),null):null;
function lockView(){return `<div class="lock"><form data-form="unlock" class="card" style="width:100%;max-width:340px"><div class="ctr"><div class="logo">🔒</div><h2>Locked</h2><p class="mut" style="margin:0 0 12px">${esc(U.name)} — enter your PIN</p></div><input name="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off" required><div class="err">${esc(err)}</div><button class="pri" style="width:100%">Unlock</button><p class="ctr" style="margin:12px 0 0"><a href="#" data-act="logout">Log out instead</a></p></form></div>`}
// ---- sortable / pageable / column-toggle tables ----
let TS=load('pos3_tbl',{});
const saveTS=()=>{try{localStorage.setItem('pos3_tbl',JSON.stringify(TS))}catch(e){}};
const tkey=t=>tab+'|'+(md||'')+'|'+[...t.rows[0].cells].map(x=>x.textContent.trim()).join('/');
const stOf=k=>TS[k]||(TS[k]={s:-1,d:1,h:[],p:1});
const cv=c=>{if(!c)return '';if(c.dataset.v!=null)return c.dataset.v;const i=c.querySelector('input');return i?i.value:c.textContent.trim()};
const num=v=>/^[-+]?\$?-?\d[\d,]*\.?\d*$/.test(String(v).trim())?parseFloat(String(v).replace(/[$,]/g,'')):NaN;
function applyT(t){
  const st=stOf(tkey(t)),head=t.rows[0],body=[...t.rows].slice(1).filter(r=>r.parentNode.tagName!=='TFOOT');
  if(st.s>=0&&body.length){body.sort((a,b)=>{const x=cv(a.cells[st.s]),y=cv(b.cells[st.s]),nx=num(x),ny=num(y);return (!isNaN(nx)&&!isNaN(ny)?nx-ny:String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'}))*st.d});const par=body[0].parentNode;body.forEach(r=>par.appendChild(r))}
  const pages=Math.max(1,Math.ceil(body.length/ps));st.p=Math.min(Math.max(1,st.p||1),pages);
  body.forEach((r,i)=>{r.style.display=(i>=(st.p-1)*ps&&i<st.p*ps)?'':'none'});

    let p=av.find(x=>x.code&&x.code.toLowerCase()===nm)||av.find(x=>dn(x).toLowerCase()===nm);if(!p&&nm){const m=av.filter(x=>dn(x).toLowerCase().includes(nm));if(m.length===1)p=m[0]}
    if(p)addCart(p,qty);else toast(!nm?'Type a product name first':av.some(x=>dn(x).toLowerCase().includes(nm))?'Several products match - choose one from the list':'No in-stock product matches that name','warn')}

    const chg=Math.max(0,sum-tot);
    if(chg>cash+0.004)return toast('Card, mobile and bank payments cannot exceed the total','warn');
    pp=pp.filter(p=>p.amt>0);
    return ask('Complete this '+(pp.length>1?'split-payment':pp[0].m)+' sale of '+money(tot)+'?',()=>{
      const items=[];let total=0,profit=0;
      for(const c of cart){const p=prods.find(x=>x.id===c.id);if(!p||p.stock<c.qty){toast('Insufficient stock: '+(p?p.name:'item'),'warn');return}
        items.push({id:p.id,name:dn(p),price:c.price,buy:p.buy,qty:c.qty});total+=c.price*c.qty;profit+=(c.price-p.buy)*c.qty}
      if(!items.length)return;
      const dd=discAmt(),sub=total;total=Math.round((total-dd)*100)/100;profit-=dd;
      items.forEach(i=>{prods.find(p=>p.id===i.id).stock-=i.qty});
      const s={id:uid(),co:C.code,no:Math.max(0,...mine(sales).map(x=>x.no||0))+1,ts:Date.now(),by:U.name,items,total,profit,disc:dd,sub,pay:pp.length>1?'Split':pp[0].m,pays:pp,paid:sum,change:chg,cust:(cu.name||cu.phone||cu.note)?cu:null};
      sales.push(s);save(K.p,prods);save(K.l,sales);cart=[];rc=s.id;paid='';disc={on:false,type:'%',val:''};pays=[{m:'Cash',amt:'',ref:''}];cust={name:'',phone:'',note:''};toast('Sale completed: '+money(total)+' ('+s.pay+')');
      const low=items.map(i=>prods.find(p=>p.id===i.id)).filter(p=>p.stock<=5);
      if(low.length)setTimeout(()=>toast('Low stock: '+low.map(p=>p.name+' ('+p.stock+')').join(', '),'warn'),700);
    });}
  if(a==='delcat'&&can('products')){if(prods.some(p=>p.cat===id))return toast('Remove its products first');return ask('Delete this category?',()=>{cats=cats.filter(c=>c.id!==id);save(K.g,cats);toast('Category deleted')})}
  if(a==='delprod'&&can('products'))return ask('Delete this product?',()=>{prods=prods.filter(p=>p.id!==id);cart=cart.filter(c=>c.id!==id);save(K.p,prods);toast('Product deleted')});
  if(a==='deluser'&&can('users')&&id!==U.id)return ask('Delete this user?',async()=>{await api('DELETE','/api/users/'+id);users=users.filter(u=>u.id!==id);toast('User deleted')});
  render();
});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.input;
  if(k==='mq'){mq=t.value;const p=t.selectionStart;render();const n=$('#mq');if(n){n.focus();n.setSelectionRange(p,p)}return}
  if(k==='dv'){disc.val=t.value;updTot();return}
  if(k==='pa'||k==='pr'){const p=pays[+t.dataset.i];if(p){p[k==='pa'?'amt':'ref']=t.value;if(k==='pa')updTot()}return}
  if(k!=='q')return;q=t.value;pg.sell=pg.scat=1;const p=t.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){const p=findCode(e.target.value);if(p){e.preventDefault();if(p.stock>0)addCart(p);else toast('Out of stock: '+dn(p),'warn');q='';pg.sell=pg.scat=1;render()}}
  if(e.key==='Enter'&&e.target.id==='qn'){e.preventDefault();const b=document.querySelector('[data-act=qadd]');if(b)b.click()}});
applyTheme();
render();
if(token)boot().then(render).catch(()=>{token='';try{localStorage.removeItem('pos3_token')}catch(e){}render()});
setInterval(()=>{if(token&&U&&!md&&!rc&&!dr&&!lk&&!document.querySelector('.cfm')&&!['INPUT','SELECT'].includes(document.activeElement.tagName))boot(true).then(render).catch(()=>{})},30000);
</script>
</body>
